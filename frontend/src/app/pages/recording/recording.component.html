<div class="container">

    
    <button class ="button" *ngIf="!isRecording" (click)="startRecording()">
      Record
    </button>
  
    
    <div *ngIf="isRecording">
  
      <canvas #waveCanvas></canvas>
      <button (click)="pauseRecording()" *ngIf="!isPaused">
        Pause
      </button>
      <button (click)="resumeRecording()" *ngIf="isPaused">
        Resume
      </button>
      <button (click)="stopRecording()">
        Stop
      </button>
  
    </div>
    <div class="loading-overlay" *ngIf="isLoading">
      <div class="loading-box">
        <div class="spinner"></div>
        <p>Loading</p>
      </div>
    </div>
    
    <div class="loading-overlay" *ngIf="showSuccess">
      <div class="loading-box success-box">
        <div class="success-icon">✓</div>
        <p>Done</p>
      </div>
    </div>
  </div>
